[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/cursor-gateway",
    "crates/adapters-codex",
    "crates/adapters-claude",
    "crates/adapters-claude-desktop",
    "crates/adapters-grok",
    "crates/adapters-opencode",
    "crates/adapters-pi",
    "crates/adapters-zcode",
    "crates/adapters-workbuddy",
    "crates/tokens-core",
    "crates/usage-query",
    "crates/store",
    "crates/session",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
authors = ["router-switch"]

[workspace.dependencies]
domain = { path = "crates/domain" }
cursor-gateway = { path = "crates/cursor-gateway" }
adapters-codex = { path = "crates/adapters-codex" }
adapters-claude = { path = "crates/adapters-claude" }
adapters-claude-desktop = { path = "crates/adapters-claude-desktop" }
adapters-grok = { path = "crates/adapters-grok" }
adapters-opencode = { path = "crates/adapters-opencode" }
adapters-pi = { path = "crates/adapters-pi" }
adapters-zcode = { path = "crates/adapters-zcode" }
adapters-workbuddy = { path = "crates/adapters-workbuddy" }
store = { path = "crates/store" }
usage-query = { path = "crates/usage-query" }
session = { path = "crates/session" }
ui = { path = "crates/ui" }
tokens-core = { path = "crates/tokens-core" }

anyhow = "1"
dirs = "6"
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
toml = "0.8"
tracing = "0.1"
tempfile = "3"
ureq = { version = "2.10", features = ["json"] }
rust-i18n = "3.1.5"
base64 = "0.22"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rayon = "1.10"
simd-json = "0.14"
bincode = "1.3"
walkdir = "2"
chrono-tz = "0.10"
reqwest = { version = "0.12", features = ["json", "native-tls-vendored", "cookies"], default-features = false }
once_cell = "1"
zstd = "0.13"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
libc = "0.2"
fs2 = "0.4"
serial_test = "3"
