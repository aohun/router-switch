usage_script:
  title: "Configure Usage Query"
  enable: "Enable Usage Query"
  template: "Preset Template"
  template_general: "General"
  credentials_hint: "Leave empty to use provider credentials"
  api_key: "API Key (optional)"
  base_url: "Base URL (optional)"
  access_token: "Access Token"
  user_id: "User ID"
  timeout: "Timeout (seconds)"
  interval: "Auto query interval (minutes, 0 = disabled)"
  code: "Extractor Script"
  code_hint: "Returned object must contain remaining balance fields; supports {{baseUrl}}/{{apiKey}}/{{accessToken}}/{{userId}} variables"
  guide_title: "Script Guide:"
  guide_format: "Config format:"
  guide_sample: "({\n  request: {\n    url: \"{{baseUrl}}/api/usage\",\n    method: \"POST\",\n    headers: {\n      \"Authorization\": \"Bearer {{apiKey}}\",\n      \"User-Agent\": \"router-switch/1.0\"\n    }\n  },\n  extractor: function(response) {\n    return {\n      isValid: !response.error,\n      remaining: response.balance,\n      unit: \"USD\"\n    };\n  }\n})"
  guide_fields_title: "extractor return fields (all optional):"
  guide_fields: "• isValid: boolean, whether the plan is valid\n• invalidMessage: string, why it is invalid (shown when isValid is false)\n• remaining: number, remaining balance\n• unit: string, unit (e.g. \"USD\")\n• planName: string, plan name\n• total: number, total quota\n• used: number, used quota\n• extra: string, free-form extra text to display"
  guide_tips_title: "💡 Tips:"
  guide_tips: "• {{apiKey}} and {{baseUrl}} are substituted automatically\n• extractor runs in a sandboxed environment with ES2020+ syntax\n• the whole config must be wrapped in () to form an object literal expression"
