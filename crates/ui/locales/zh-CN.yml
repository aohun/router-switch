  guide_title: "脚本编写说明："
  guide_format: "配置格式："
  guide_sample: "({\n  request: {\n    url: \"{{baseUrl}}/api/usage\",\n    method: \"POST\",\n    headers: {\n      \"Authorization\": \"Bearer {{apiKey}}\",\n      \"User-Agent\": \"router-switch/1.0\"\n    }\n  },\n  extractor: function(response) {\n    return {\n      isValid: !response.error,\n      remaining: response.balance,\n      unit: \"USD\"\n    };\n  }\n})"
  guide_fields_title: "extractor 返回格式（所有字段均为可选）："
