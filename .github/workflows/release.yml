name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build macOS Binary
        run: cargo build --release --target ${{ matrix.target }} -p router-switch

      - name: Package macOS Artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/router-switch dist/
          cd dist
          zip -r ../router-switch-macOS-${{ matrix.arch }}.zip router-switch
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: router-switch-macOS-${{ matrix.arch }}.zip

  windows:
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build Windows Binary
        run: cargo build --release -p router-switch

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/router-switch.exe -DestinationPath router-switch-windows-x86_64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: router-switch-windows-x86_64.zip

  release:
    needs: [macos, windows]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
